name: Android Native Build & Safety Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-verify-and-build:
    name: Typecheck, Safety Suite, RN Bundle & Native Gradle APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare CI step runner with full error/evidence annotations
        run: |
          cat << 'EOF' > /tmp/ci_exec.sh
          #!/usr/bin/env bash
          set -o pipefail
          TITLE="$1"
          shift
          LOG="/tmp/ci_step_$(date +%s%N).log"
          "$@" 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          TAIL_RAW=$(tail -n 65 "$LOG" | tr -d '\r')
          ENCODED="${TAIL_RAW//'%'/'%25'}"
          ENCODED="${ENCODED//$'\n'/'%0A'}"
          if [ "$RC" -ne 0 ]; then
            echo "::error title=${TITLE} (exit ${RC})::${ENCODED}"
            exit "$RC"
          fi
          SUMMARY_TAIL=$(tail -n 18 "$LOG" | tr -d '\r')
          SUM_ENC="${SUMMARY_TAIL//'%'/'%25'}"
          SUM_ENC="${SUM_ENC//$'\n'/'%0A'}"
          echo "::notice title=${TITLE} (exit 0)::${SUM_ENC}"
          EOF
          chmod +x /tmp/ci_exec.sh

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bootstrap & install Android SDK 35/34, Build-Tools 35.0.0, NDK 26.1.10909125 & CMake 3.22.1
        run: |
          /tmp/ci_exec.sh "Android SDK Setup" bash -c '
            set -euo pipefail
            if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_ROOT="${ANDROID_HOME}"
            elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_ROOT="/usr/local/lib/android/sdk"
            else
              SDK_ROOT="${HOME}/android-sdk"
              if [ ! -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
                echo "Installing official Google Android Command-Line Tools into ${SDK_ROOT}..."
                if ! command -v unzip >/dev/null 2>&1; then
                  sudo apt-get update -y && sudo apt-get install -y unzip curl
                fi
                mkdir -p "${SDK_ROOT}/cmdline-tools"
                curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
                unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_unpack
                rm -rf "${SDK_ROOT}/cmdline-tools/latest"
                mv /tmp/cmdtools_unpack/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
                rm -rf /tmp/cmdtools.zip /tmp/cmdtools_unpack
              fi
            fi

            export ANDROID_HOME="${SDK_ROOT}"
            export ANDROID_SDK_ROOT="${SDK_ROOT}"
            export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"

            echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
            echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
            echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

            yes | sdkmanager --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
            sdkmanager --sdk_root="${SDK_ROOT}" --install \
              "platform-tools" \
              "platforms;android-35" \
              "platforms;android-34" \
              "build-tools;35.0.0" \
              "ndk;26.1.10909125" \
              "cmake;3.22.1"

            printf "sdk.dir=%s\n" "${SDK_ROOT}" > android/android/local.properties
            java -version
            sdkmanager --sdk_root="${SDK_ROOT}" --list_installed | head -n 30
          '

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: 1. Install web & Android npm dependencies cleanly (npm ci)
        run: /tmp/ci_exec.sh "Step 1 - npm ci" bash -c "set -euo pipefail && npm ci && cd android && npm ci"

      - name: 2. Run Android TypeScript check
        working-directory: android
        run: /tmp/ci_exec.sh "Step 2 - Android tsc" npm run typecheck

      - name: 3. Run Android automated safety & integrity test suite
        working-directory: android
        run: /tmp/ci_exec.sh "Step 3 - Android Safety Tests" npm test

      - name: 4. Run Web TypeScript check
        run: /tmp/ci_exec.sh "Step 4 - Web tsc" npx tsc --noEmit

      - name: 5. Build React Native Android JS bundle
        working-directory: android
        run: |
          /tmp/ci_exec.sh "Step 5 - RN Android Bundle" bash -c '
            set -euo pipefail
            mkdir -p /tmp/meteogis-rn-bundle/assets
            npx react-native bundle \
              --platform android \
              --dev false \
              --entry-file index.js \
              --bundle-output /tmp/meteogis-rn-bundle/index.android.bundle \
              --assets-dest /tmp/meteogis-rn-bundle/assets
            ls -lh /tmp/meteogis-rn-bundle/index.android.bundle
          '

      - name: 6. Verify Gradle wrapper & version (`./gradlew --version`)
        working-directory: android/android
        run: /tmp/ci_exec.sh "Step 6 - Gradle Version" ./gradlew --version --no-daemon

      - name: 7. Assemble native Android Debug APK (`./gradlew assembleDebug`)
        working-directory: android/android
        run: |
          /tmp/ci_exec.sh "Step 7 - assembleDebug" bash -c '
            set -euo pipefail
            ./gradlew assembleDebug --no-daemon --stacktrace
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          '

      - name: 8. Directly verify release API configuration (`./gradlew verifyReleaseApiConfig` positive & negative checks)
        working-directory: android/android
        run: |
          /tmp/ci_exec.sh "Step 8 - verifyReleaseApiConfig" bash -c '
            set -euo pipefail
            ./gradlew verifyReleaseApiConfig --no-daemon
            ./gradlew verifyReleaseApiConfig -PPROD_API_URL=https://meteo-gis.vercel.app --no-daemon

            for BAD_URL in \
              "http://meteo-gis.vercel.app" \
              "http://10.0.2.2:3000" \
              "https://localhost:3000" \
              "https://127.0.0.1:3000" \
              "https://api.example.com"
            do
              if ./gradlew verifyReleaseApiConfig "-PPROD_API_URL=${BAD_URL}" --no-daemon >/dev/null 2>&1; then
                echo "ERROR: verifyReleaseApiConfig unexpectedly accepted unsafe URL: ${BAD_URL}"
                exit 1
              else
                echo "Confirmed blocked unsafe release URL: ${BAD_URL}"
              fi
            done
          '

      - name: 9. Assemble native Android Release APK (`./gradlew assembleRelease -PPROD_API_URL=https://meteo-gis.vercel.app`)
        working-directory: android/android
        run: |
          /tmp/ci_exec.sh "Step 9 - assembleRelease" bash -c '
            set -euo pipefail
            ./gradlew assembleRelease -PPROD_API_URL=https://meteo-gis.vercel.app --no-daemon --stacktrace
            ls -lh app/build/outputs/apk/release/
            sha256sum app/build/outputs/apk/release/*.apk
          '

      - name: Non-destructive live `https://meteo-gis.vercel.app` contract check (zero SOS or emergency calls)
        run: |
          /tmp/ci_exec.sh "Live Vercel Non-Destructive Contract Check" node -e '
            (async () => {
              const base = "https://meteo-gis.vercel.app";
              const getCheck = async (path) => {
                const r = await fetch(base + path);
                if (!r.ok) throw new Error(`${path} returned HTTP ${r.status}`);
                const j = await r.json();
                console.log(`[OK] GET ${path} -> HTTP ${r.status}, keys=${Object.keys(j).join(",")}`);
                return j;
              };
              await getCheck("/api/live/hazards");
              await getCheck("/api/live/warnings");
              await getCheck("/api/live/stations");
              await getCheck("/api/roads/incidents");

              const riskRes = await fetch(base + "/api/risk/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  district: "East Sikkim",
                  latitude: 27.3389,
                  longitude: 88.6065,
                  coordinates: [27.3389, 88.6065],
                  features: { rainfall_1h: 12.0, rainfall_24h: 48.0 }
                })
              });
              if (!riskRes.ok) throw new Error(`/api/risk/predict returned HTTP ${riskRes.status}`);
              const riskJson = await riskRes.json();
              console.log(`[OK] POST /api/risk/predict -> prob=${riskJson.landslide_probability}, risk_level=${riskJson.risk_level}`);

              const routeRes = await fetch(base + "/api/routing/safe-route", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  origin: { lat: 13.0827, lon: 80.2707 },
                  destination: { lat: 13.2027, lon: 80.1707 },
                  costing: "auto",
                  avoid_disasters: true
                })
              });
              if (!routeRes.ok) throw new Error(`/api/routing/safe-route returned HTTP ${routeRes.status}`);
              const routeJson = await routeRes.json();
              console.log(`[OK] POST /api/routing/safe-route -> status=${routeJson.status}, engine=${routeJson.debug_info?.engine}`);
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Upload native Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteo-gis-android-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload native Android Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteo-gis-android-release-apk
          path: android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
