name: Android Native Build & Safety Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-verify-and-build:
    name: Typecheck, Safety Suite, RN Bundle & Native Gradle APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, Build-Tools, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK platforms, Build-Tools 35.0.0, NDK 26.1.10909125 & CMake 3.22.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: 1. Install web & Android npm dependencies cleanly (npm ci)
        run: |
          npm ci
          cd android && npm ci

      - name: 2. Run Android TypeScript check
        working-directory: android
        run: npm run typecheck

      - name: 3. Run Android automated safety & integrity test suite
        working-directory: android
        run: npm test

      - name: 4. Run Web TypeScript check
        run: npx tsc --noEmit

      - name: 5. Build React Native Android JS bundle
        working-directory: android
        run: |
          mkdir -p /tmp/meteogis-rn-bundle/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/meteogis-rn-bundle/index.android.bundle \
            --assets-dest /tmp/meteogis-rn-bundle/assets
          ls -lh /tmp/meteogis-rn-bundle/index.android.bundle

      - name: 6. Verify Gradle wrapper & version (`./gradlew --version`)
        working-directory: android/android
        run: ./gradlew --version --no-daemon

      - name: 7. Assemble native Android Debug APK (`./gradlew assembleDebug`)
        working-directory: android/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 8. Directly verify release API configuration (`./gradlew verifyReleaseApiConfig` positive & negative checks)
        working-directory: android/android
        run: |
          # Must PASS with default production URL and explicit HTTPS production URL
          ./gradlew verifyReleaseApiConfig --no-daemon
          ./gradlew verifyReleaseApiConfig -PPROD_API_URL=https://meteo-gis.vercel.app --no-daemon

          # Must FAIL when given non-HTTPS, emulator, localhost, loopback, or placeholder URLs
          for BAD_URL in \
            "http://meteo-gis.vercel.app" \
            "http://10.0.2.2:3000" \
            "https://localhost:3000" \
            "https://127.0.0.1:3000" \
            "https://api.example.com"
          do
            if ./gradlew verifyReleaseApiConfig "-PPROD_API_URL=${BAD_URL}" --no-daemon >/dev/null 2>&1; then
              echo "ERROR: verifyReleaseApiConfig unexpectedly accepted unsafe URL: ${BAD_URL}"
              exit 1
            else
              echo "Confirmed blocked unsafe release URL: ${BAD_URL}"
            fi
          done

      - name: 9. Assemble native Android Release APK (`./gradlew assembleRelease -PPROD_API_URL=https://meteo-gis.vercel.app`)
        working-directory: android/android
        run: |
          ./gradlew assembleRelease -PPROD_API_URL=https://meteo-gis.vercel.app --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/

      - name: Non-destructive live `https://meteo-gis.vercel.app` contract check (zero SOS or emergency calls)
        run: |
          node -e '
            (async () => {
              const base = "https://meteo-gis.vercel.app";
              const getCheck = async (path) => {
                const r = await fetch(base + path);
                if (!r.ok) throw new Error(`${path} returned HTTP ${r.status}`);
                const j = await r.json();
                console.log(`[OK] GET ${path} -> HTTP ${r.status}, keys=${Object.keys(j).join(",")}`);
                return j;
              };
              await getCheck("/api/live/hazards");
              await getCheck("/api/live/warnings");
              await getCheck("/api/live/stations");
              await getCheck("/api/roads/incidents");

              const riskRes = await fetch(base + "/api/risk/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  district: "East Sikkim",
                  latitude: 27.3389,
                  longitude: 88.6065,
                  coordinates: [27.3389, 88.6065],
                  features: { rainfall_1h: 12.0, rainfall_24h: 48.0 }
                })
              });
              if (!riskRes.ok) throw new Error(`/api/risk/predict returned HTTP ${riskRes.status}`);
              const riskJson = await riskRes.json();
              console.log(`[OK] POST /api/risk/predict -> prob=${riskJson.landslide_probability}, risk_level=${riskJson.risk_level}`);

              const routeRes = await fetch(base + "/api/routing/safe-route", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  origin: { lat: 13.0827, lon: 80.2707 },
                  destination: { lat: 13.2027, lon: 80.1707 },
                  costing: "auto",
                  avoid_disasters: true
                })
              });
              if (!routeRes.ok) throw new Error(`/api/routing/safe-route returned HTTP ${routeRes.status}`);
              const routeJson = await routeRes.json();
              console.log(`[OK] POST /api/routing/safe-route -> status=${routeJson.status}, engine=${routeJson.debug_info?.engine}`);
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Upload native Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteo-gis-android-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload native Android Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteo-gis-android-release-apk
          path: android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
