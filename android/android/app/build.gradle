apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// By default (`-PUSE_METRO_DEV=false`), bundle JS assets directly into BOTH `app-debug.apk` and `app-release.apk`
// so every APK built in CI or locally installs & runs standalone on physical Android devices without Metro server.
// Pass `-PUSE_METRO_DEV=true` during local iterative development to connect live to Metro on port 8081.
def useMetroDevServer = (project.findProperty("USE_METRO_DEV") ?: "false").toString().trim().toBoolean()
def allowUnsignedRelease = (project.findProperty("ALLOW_UNSIGNED_RELEASE") ?: "false").toString().trim().toBoolean()

react {
    autolinkLibrariesWithApp()
    debuggableVariants = useMetroDevServer ? ["debug"] : []
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def defaultProdApiUrl = "https://meteo-gis.vercel.app"
def rawProdApiUrl = project.hasProperty("PROD_API_URL")
    ? project.property("PROD_API_URL")
    : (System.getenv("PROD_API_URL") ?: defaultProdApiUrl)
def resolvedProdApiUrl = (rawProdApiUrl ?: "").toString().trim().replaceAll('/+$', '')

def releaseStoreFile = (project.findProperty("RELEASE_STORE_FILE") ?: System.getenv("RELEASE_STORE_FILE") ?: "").toString().trim()
def releaseStorePassword = (project.findProperty("RELEASE_STORE_PASSWORD") ?: System.getenv("RELEASE_STORE_PASSWORD") ?: "").toString().trim()
def releaseKeyAlias = (project.findProperty("RELEASE_KEY_ALIAS") ?: System.getenv("RELEASE_KEY_ALIAS") ?: "").toString().trim()
def releaseKeyPassword = (project.findProperty("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_KEY_PASSWORD") ?: "").toString().trim()
def hasReleaseSigningCredentials = (
    !releaseStoreFile.isEmpty() &&
    !releaseStorePassword.isEmpty() &&
    !releaseKeyAlias.isEmpty() &&
    !releaseKeyPassword.isEmpty()
)

tasks.register("verifyReleaseApiConfig") {
    group = "verification"
    description = "Validates that PROD_API_URL is a valid HTTPS production origin and that release signing credentials are supplied unless explicitly overridden."
    doLast {
        if (resolvedProdApiUrl.isEmpty()) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL cannot be empty."
            )
        }
        URI parsedUri
        try {
            parsedUri = new URI(resolvedProdApiUrl)
        } catch (Exception e) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL is not a valid URI ('${resolvedProdApiUrl}'): ${e.message}"
            )
        }

        def scheme = (parsedUri.scheme ?: "").toLowerCase()
        def host = (parsedUri.host ?: "").toLowerCase()
        def fullLower = resolvedProdApiUrl.toLowerCase()

        if (scheme != "https" || host.isEmpty()) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL must be an https:// origin with a valid host (got '${resolvedProdApiUrl}')."
            )
        }

        def forbiddenHosts = ["10.0.2.2", "127.0.0.1", "localhost", "0.0.0.0", "::1", "[::1]"]
        if (forbiddenHosts.any { host == it || host.endsWith(".${it}") }) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL cannot target localhost, loopback, or Android emulator hosts ('${resolvedProdApiUrl}')."
            )
        }

        def placeholderPatterns = [
            "example.com",
            "example.org",
            "example.net",
            "placeholder",
            "your-domain",
            "yourdomain",
            "changeme",
            "<",
            ">"
        ]
        if (placeholderPatterns.any { fullLower.contains(it) }) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL contains a placeholder host or token ('${resolvedProdApiUrl}')."
            )
        }
    }
}

tasks.register("verifyReleaseSigningConfig") {
    group = "verification"
    description = "Ensures assembleRelease produces a signed installable app-release.apk unless -PALLOW_UNSIGNED_RELEASE=true is explicitly passed."
    doLast {
        if (!hasReleaseSigningCredentials && !allowUnsignedRelease) {
            throw new GradleException(
                "Release signing blocked: supply RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD " +
                "(via GitHub Actions Secrets or environment variables) to produce a signed installable app-release.apk."
            )
        }
        if (hasReleaseSigningCredentials && !file(releaseStoreFile).exists()) {
            throw new GradleException(
                "Release signing blocked: keystore file does not exist at '${releaseStoreFile}'."
            )
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.meteogis"
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.meteogis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        buildConfigField "String", "PROD_API_URL", "\"${resolvedProdApiUrl}\""
        buildConfigField "boolean", "USE_METRO_DEV_SERVER", useMetroDevServer.toString()
    }

    packaging {
        jniLibs {
            pickFirsts += [
                "**/libc++_shared.so",
                "**/libfbjni.so",
                "**/libjsi.so",
                "**/libreactnative.so"
            ]
        }
    }

    signingConfigs {
        if (hasReleaseSigningCredentials) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            // Signed automatically via machine-local ~/.android/debug.keystore (never committed to Git).
        }
        release {
            signingConfig hasReleaseSigningCredentials ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

tasks.configureEach { task ->
    if (
        task.name == "preReleaseBuild" ||
        task.name == "assembleRelease" ||
        task.name == "bundleRelease" ||
        task.name == "mergeReleaseResources"
    ) {
        task.dependsOn("verifyReleaseApiConfig")
    }
    if (task.name == "assembleRelease" || task.name == "bundleRelease") {
        task.dependsOn("verifyReleaseSigningConfig")
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
