apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def resolvedProdApiUrl = (
    project.findProperty("PROD_API_URL") ?: System.getenv("PROD_API_URL") ?: "https://meteo-gis.vercel.app"
).toString().trim()

tasks.register("verifyReleaseApiConfig") {
    doLast {
        if (!resolvedProdApiUrl) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL is required (e.g. ./gradlew assembleRelease -PPROD_API_URL=https://api.yourdomain.org)."
            )
        }
        if (!resolvedProdApiUrl.startsWith("https://")) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL must start with https:// (got '${resolvedProdApiUrl}')."
            )
        }
        def lower = resolvedProdApiUrl.toLowerCase()
        if (lower.contains("10.0.2.2") || lower.contains("127.0.0.1") || lower.contains("localhost") || lower.contains("example.com")) {
            throw new GradleException(
                "Release build blocked: PROD_API_URL cannot be an emulator, localhost, or placeholder host ('${resolvedProdApiUrl}')."
            )
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.meteogis"
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.meteogis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "PROD_API_URL", "\"${resolvedProdApiUrl}\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Configure release signing credentials via gradle.properties in production CI;
            // debug signing fallback enables local smoke verification once -PPROD_API_URL=https://... is supplied.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == "assembleRelease" || task.name == "bundleRelease" || task.name == "mergeReleaseResources") {
        task.dependsOn("verifyReleaseApiConfig")
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
